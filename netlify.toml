[build]
  command = "npm run build"
  publish = "dist"

# Environment variables can be set here
[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# If you need scheduled functions, use the current version of the plugin
# Commented out until needed to prevent build errors
